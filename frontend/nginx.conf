server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Repassa /api para a API, sem o prefixo (a barra no fim do proxy_pass remove o /api/).
    location /api/ {
        proxy_pass http://api:8080/;
    }

    # Rotas do React Router: qualquer caminho que não seja arquivo cai no index.html.
    location / {
        try_files $uri /index.html;
    }
}
