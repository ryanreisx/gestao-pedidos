services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-GestaoPedidos123}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Execução única: roda os scripts de database/ em ordem e termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-GestaoPedidos123}
    volumes:
      - ./database:/database:ro
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for script in /database/*.sql; do
          echo "Executando $$script"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -f 65001 -i "$$script"
        done
        echo "Banco pronto."

  api:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: Server=sqlserver,1433;Database=GestaoPedidos;User Id=sa;Password=${SA_PASSWORD:-GestaoPedidos123};TrustServerCertificate=True
    ports:
      - "5080:8080"

volumes:
  sqlserver-data:
